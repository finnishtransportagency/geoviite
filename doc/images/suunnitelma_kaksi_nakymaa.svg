<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1e1e1c; font-size: 12px; }
    .h { font-size: 13px; font-weight: bold; }
    .b { font-weight: bold; }
    .dim { fill: #66645e; font-size: 11px; }
    .box { fill: #ffffff; stroke: #1e1e1c; stroke-width: 1.2; }
    .acc { fill: #ffffff; stroke: #2b5d8a; stroke-width: 2; }
    .none { fill: none; stroke: #66645e; stroke-width: 1; stroke-dasharray: 4 3; }
    .edge { stroke: #1e1e1c; stroke-width: 1.3; fill: none; }
    .edgeacc { stroke: #2b5d8a; stroke-width: 1.6; fill: none; }
    .lane { stroke: #dcd9d1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1c"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b5d8a"/></marker>
  </defs>
  <rect width="820" height="340" fill="white"/>

