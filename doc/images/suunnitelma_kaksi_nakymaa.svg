  <rect x="675" y="108" width="110" height="34" rx="4" class="box"/><text x="730" y="130" text-anchor="middle">main</text>

  <line x1="240" y1="170" x2="800" y2="170" class="lane"/>

  <rect x="255" y="200" width="110" height="34" rx="4" class="acc"/><text x="310" y="222" text-anchor="middle">suunnitelman rivi</text>
  <rect x="395" y="200" width="110" height="34" rx="4" class="box"/><text x="450" y="222" text-anchor="middle">main-rivi</text>
