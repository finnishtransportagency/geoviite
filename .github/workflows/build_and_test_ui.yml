name: Build UI Package

on:
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - '.prettierrc.json'
      - 'ui/**'

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Check formatting
        working-directory: ./ui
        run: npm run format:check

      - name: Check lint
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run lint:check

      - name: Build UI
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run build

      - name: Test UI
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run test
