name: PULL REQUEST

run-name: ${{ github.actor }} wants to merge ${{ github.head_ref }} into ${{ github.base_ref }}

on:
  pull_request:
    branches:
      - main
      - release/**

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.check.outputs.workflows }}
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # Fetch history so git diff works reliably

      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare the PR head against the base branch (e.g., origin/main)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          # Initialize flags
          FRONTEND=false
          BACKEND=false
          WORKFLOWS=false

          # Loop through changed files and check patterns
          for file in $CHANGED_FILES; do
            if [[ "$file" =~ ^ui/ ]] || [[ "$file" == ".prettierrc.json" ]]; then
              FRONTEND=true
            elif [[ "$file" =~ ^infra/ ]] || [[ "$file" =~ ^docker-images/ ]]; then
              BACKEND=true
            elif [[ "$file" =~ ^\.github/workflows/ ]]; then
              WORKFLOWS=true
            fi
          done

          # Set outputs for GitHub Actions
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "workflows=$WORKFLOWS" >> $GITHUB_OUTPUT

  frontend-build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Check formatting
        working-directory: ./ui
        run: npm run format:check

      - name: Check lint
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run lint:check

      - name: Build UI
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run build

      - name: Test UI
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npm run test

  backend-build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Download repository on the runner
        uses: actions/checkout@v7

      - name: Configure JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check Kotlin formatting
        run: infra/script/ktfmt.sh --dry-run --all

      - name: Use cache for Postgres Docker image
        id: load-cached-postgres-image
        uses: actions/cache@v6
        with:
          path: /tmp/.docker
          key: geoviite-postgres-${{ hashFiles('docker-images/geoviite-postgres/**') }}

      - name: Use cached Postgres Docker image if it exists
        if: steps.load-cached-postgres-image.outputs.cache-hit == 'true'
        run: |
          docker image load -i /tmp/.docker/geoviite-postgres-image.tar

      - name: Build Postgres Docker image if it was not found from the cache
        if: steps.load-cached-postgres-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/.docker
          docker image build -t gvt-postgres ./docker-images/geoviite-postgres
          docker image save -o /tmp/.docker/geoviite-postgres-image.tar gvt-postgres

      - name: Execute Gradle build
        run: |
          cd infra
          ./build.sh

      - name: Run unit tests in infra (backend)
        run: |
          cd infra
          ./run_unit_tests.sh

      - name: Run integration tests in infra (backend)
        env:
          POSTGRES_DB: 'geoviite'
          POSTGRES_USER: 'dev-geouser'
          POSTGRES_PASSWORD: 'dev-geouser-password'
        run: |
          docker run -d -p 127.0.0.1:5436:5432 \
          -e POSTGRES_DB=$POSTGRES_DB \
          -e POSTGRES_USER=$POSTGRES_USER \
          -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
           --name geoviite-db-github gvt-postgres
          
          cd infra
          ./run_it_tests.sh

      - name: Run DAO integration tests without cache in infra (backend)
        run: |
          cd infra
          ./run_it_tests_without_cache.sh

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/*test*/TEST*.xml'
          detailed_summary: true

  detekt-check:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Download detekt
        run: |
          curl -sSL -o /tmp/detekt.jar \
          https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: Checkout the branch that triggered the workflow
        uses: actions/checkout@v7

      - name: Copy the detekt config from the branch that triggered the workflow
        run: |
          cp infra/detekt.yml /tmp/detekt-config.yml

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Run detekt to create a baseline from the base branch
        run: |
          java -jar /tmp/detekt.jar \
          --config /tmp/detekt-config.yml \
          --base-path ${{ github.workspace }} \
          --input ${{ github.workspace }}/infra \
          --create-baseline \
          --baseline /tmp/detekt-baseline.xml

      - name: Checkout the branch that triggered the workflow
        uses: actions/checkout@v7

      - name: Run detekt again to check for errors created by the branch that triggered the workflow
        run: |
          java -jar /tmp/detekt.jar \
          --config /tmp/detekt-config.yml \
          --base-path ${{ github.workspace }} \
          --input ${{ github.workspace }}/infra \
          --baseline /tmp/detekt-baseline.xml \
          --report sarif:${{ github.workspace }}/infra/build/reports/detekt/detekt.sarif

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ github.workspace }}/infra/build/reports/detekt/detekt.sarif
