spring:
  datasource:
    url: "jdbc:postgresql://${DB_URL:localhost:5436/geoviite}"
    hikari:
      minimum-idle: 0
geoviite:
  scheduling:
    enabled: false
  data:
    import: false
  skip-auth: true
  ratko:
    enabled: false
  ratko-fake-oid-generator:
    enabled: true
  projektivelho:
    enabled: false
  ext-api:
    enabled: true
    designs-enabled: true
    max-batch-requests: 1000
    url-path-prefixes:
      - /geoviite
      - /rata-vkm
    public-hosts: "${GEOVIITE_EXT_API_PUBLIC_HOSTS:localhost}"
    private-hosts: "${GEOVIITE_EXT_API_PRIVATE_HOSTS:localhost}"
springdoc:
  enable-default-api-docs: false
  trim-kotlin-indent: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
